[mavlink]
device = "/dev/ttyAMA2"
device2 = "/dev/ttyAMA3"
baud = 115200
mav_version = 2

[drops]
cruise_speed = 20
wind_speed = 5
wind_direction = 270
altitude = 60

[drops.beacon]
mass = 500
cd = 1
drop_course = 10
x_translation = -45.62005614816896
y_translation = 10.394985962957753

[drops.bottle]
mass = 500
cd = 0.2
drop_course = 10
x_translation = -40.852570470817724
y_translation = 12.786857382295567

[camera]
resolution = [
    640,
    400,
]
K = [
    [692.45913591,   0.0,         635.07827968,],
    [ 0.0,        692.52565945, 395.26189078],
    [ 0.0, 0.0, 1.0, ],
]
distortion = [ -3.42194310e-01,  1.23526508e-01,  4.70056821e-03, -1.09821856e-04, -2.11505931e-02, ]

[dirs]
logs_dir = "media/logs"
photos_dir = "media/photos"
videos_dir = "media/videos"
zones_dir = "configuration/zones"
targets_file = "media/droniada_targets.json"

[system]
debug_mode = false

[zones]
search_zone_path = "Sloszowa_target_detection_1.poly"

[mission]
start_wp = 5
stop_wp = 96
is_bottle = true

[mission.loiter]
time = 15
alt = 60
radius = 50

[mission.ook]
duration_s = 10
candidates = [5.0, 7.0, 9.0]
min_confidence = 4.0
roi_size = 40
brightness_threshold = 220
