[mavlink]
device = "/dev/ttyAMA2"
device2 = "/dev/ttyAMA3"
baud = 115200
mav_version = 2

[drops]
cruise_speed = 0
wind_speed = 5
wind_direction = 270
altitude = 50

[drops.beacon]
mass = 500
cd = 0.55
drop_course = 120
x_translation = 1.888937981556584e-16
y_translation = 1.028289943338078

[drops.bottle]
mass = 500
cd = 0.55
drop_course = 120
x_translation = 3.0149249673174517e-16
y_translation = 1.6412487091061998

[camera]
resolution = [
    640,
    400,
]
K = [
    [
        420.56624654,
        0.0,
        313.86132572,
    ],
    [
        0.0,
        421.58131545,
        203.36702095,
    ],
    [
        0.0,
        0.0,
        1.0,
    ],
]
distortion = [
    -0.06905645,
    0.07627358,
    -0.11298309,
    0.05177157,
]
fisheye = true

[dirs]
logs_dir = "media/logs"
photos_dir = "media/photos"
videos_dir = "media/videos"
zones_dir = "configuration/zones"
targets_file = "media/droniada_targets.json"

[system]
debug_mode = false

[zones]
search_zone_path = "gliwice_big_debug.poly"

[mission]
start_wp = 4
stop_wp = 6
is_bottle = true
# Indeks waypointu w MP, przy którym dopinamy trasę OOK (pary WAYPOINT + LOITER)
modulation_start_wp = 4

[[mission.landing_sites]]
lat = 50.2710
lon = 18.6720

